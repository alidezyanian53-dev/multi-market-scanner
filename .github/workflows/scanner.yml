name: Market Scanner Bot

on:
  # زمان‌بندی اجرا (به وقت UTC) - مثلاً هر روز ساعت ۸ صبح
  schedule:
    - cron: '0 8 * * *'
  
  # به شما اجازه می‌دهد هر زمان که خواستید، به صورت دستی هم دکمه‌ی اجرا را بزنید
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      # ۱. دریافت کدهای پروژه از ریپازیتوری
      - name: Checkout repository
        uses: actions/checkout@v3

      # ۲. تنظیم نسخه پایتون روی سرور گیت‌هاب
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ۳. نصب کتابخانه‌های مورد نیاز از روی فایل requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ۴. اجرای اسکریپت پایتون
      - name: Run Python script
        run: python "Scanner Bot_2.py"
