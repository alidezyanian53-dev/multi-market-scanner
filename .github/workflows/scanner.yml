name: Market Scanner Bot

on:
  workflow_dispatch:  # امکان اجرای دستی در هر زمان
  schedule:
    - cron: '30 4 * * *'  # اجرای خودکار هر روز ساعت 8:00 صبح به وقت ایران (4:30 UTC)

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run scanner script
        run: |
          python Scanner_Bot_2.py
